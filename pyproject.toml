[project]
name = "asl-recognizer"
version = "1.0.0"
description = "Real-time ASL Sign Language Recognition using MediaPipe + Keras"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "mediapipe>=0.10.14",
    "tensorflow-cpu>=2.16.0",
    "opencv-python>=4.9.0.80",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "python-multipart>=0.0.9",
    "pillow>=10.3.0",
    "aiofiles>=23.2.1",
    "pydantic>=2.7.0",
    "tqdm>=4.66.0",
    "jupyter>=1.1.1",
    "notebook>=7.5.6",
    "ipykernel>=7.2.0",
    "seaborn>=0.13.2",
    "matplotlib>=3.10.9",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "model*"]
